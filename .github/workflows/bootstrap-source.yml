name: Restore portfolio source
on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore cleaned portfolio source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/java-*.b64 | tr -d '\n' | base64 -d > /tmp/source.zip
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          cp -a /tmp/source/Java-mines-game/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cleaned Java Mines Game source"
          git push
# retry after archive repair
